name: ai_nutrition_clinic
description: AI-powered nutrition tracking app with Firebase and Gemini AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # DI
  get_it: ^7.7.0

  # Navigation
  go_router: ^14.2.7

  # Networking / AI
  google_generative_ai: ^0.4.6
  http: ^1.2.2

  # Local Storage
  shared_preferences: ^2.3.2

  # Functional Programming
  dartz: ^0.10.1

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  fl_chart: ^0.69.0
  shimmer: ^3.0.0

  # Utilities
  internet_connection_checker: ^1.0.0+1
  intl: ^0.19.0
  uuid: ^4.4.2
  logger: ^2.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
